<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>蓁便誼線上訂購</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<style>
/* Layout: phone-first single column; sticky header + tabs, product list, cart bar pinned to bottom */
:root{
  --bg:#FFF8F3; --surface:#FFFFFF; --fg:#3E2418; --muted:#8C6E60; --line:#F2DED3;
  --pink:#D9265F; --pink-soft:#FDE6EE; --green:#2E7D3A; --green-soft:#E3F2E1; --gold:#F2B33D;
  --shadow:0 2px 0 #F0D7CA;
  --font:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1F1517; --surface:#2B1E21; --fg:#F6E8E1; --muted:#C3A79A; --line:#46323A;
  --pink:#FF6F9A; --pink-soft:#4A2532; --green:#7ED18A; --green-soft:#24362A; --gold:#F5C25E;
  --shadow:0 2px 0 #120C0D; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1F1517; --surface:#2B1E21; --fg:#F6E8E1; --muted:#C3A79A; --line:#46323A;
  --pink:#FF6F9A; --pink-soft:#4A2532; --green:#7ED18A; --green-soft:#24362A; --gold:#F5C25E;
  --shadow:0 2px 0 #120C0D; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.5;
  padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding-inline:16px}
[hidden]{display:none!important}

header{position:sticky;top:0;z-index:5;background:var(--bg);padding-top:env(safe-area-inset-top,0px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:12px;padding-block:10px}
.brand img{width:64px;height:auto}
.brand h1{margin:0;font-size:20px;font-weight:900;color:var(--pink);line-height:1.2}
.brand p{margin:0;font-size:13px;color:var(--muted)}
.tabs{display:flex;gap:4px}
.tab{flex:1;background:none;border:0;padding:10px 0 12px;font-weight:700;color:var(--muted);border-bottom:3px solid transparent}
.tab[aria-selected="true"]{color:var(--pink);border-color:var(--pink)}

.demo{margin-top:12px;background:var(--pink-soft);color:var(--pink);border-radius:10px;padding:8px 12px;font-size:13px;font-weight:700}
.chips{display:flex;gap:8px;overflow-x:auto;padding-block:12px;scrollbar-width:none}
.chip{flex:none;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-size:14px;font-weight:700}
.chip[aria-pressed="true"]{background:var(--green);border-color:var(--green);color:var(--surface)}

.list{display:flex;flex-direction:column;gap:12px}
.item{display:grid;grid-template-columns:84px 1fr;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px;box-shadow:var(--shadow)}
.thumb{width:84px;height:84px;border-radius:12px;object-fit:cover;background:var(--pink-soft);display:grid;place-items:center;font-size:30px;font-weight:900;color:var(--pink)}
.info{min-width:0;display:flex;flex-direction:column;gap:2px}
.name{font-weight:700;font-size:16px;line-height:1.35}
.desc{font-size:13px;color:var(--muted)}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:auto;padding-top:6px}
.price{font-weight:900;font-size:18px;color:var(--pink);font-variant-numeric:tabular-nums}
.price small{font-size:13px;color:var(--muted);font-weight:500}
.stock{font-size:12px;color:var(--muted)}
.stock.low{color:var(--pink);font-weight:700}
.step{display:flex;align-items:center;gap:2px}
.step button{width:34px;height:34px;border-radius:50%;border:0;background:var(--green-soft);color:var(--green);font-size:20px;font-weight:900;line-height:1}
.step button.add{background:var(--green);color:var(--surface)}
.step button:disabled{opacity:.35;cursor:not-allowed}
.step output{min-width:28px;text-align:center;font-weight:900;font-variant-numeric:tabular-nums}
.empty{text-align:center;color:var(--muted);padding:40px 0}

.bar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px))}
.bar .wrap{display:flex;align-items:center;gap:12px;padding:0}
.bar .sum{flex:1;min-width:0}
.bar .sum b{font-size:20px;color:var(--pink);font-variant-numeric:tabular-nums}
.bar .sum span{display:block;font-size:12px;color:var(--muted)}
.btn{border:0;border-radius:999px;background:var(--pink);color:#fff;font-weight:900;font-size:16px;padding:12px 22px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:var(--pink-soft);color:var(--pink)}

h2{font-size:18px;margin:18px 0 10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:var(--shadow)}
.lines{display:flex;flex-direction:column;gap:10px}
.line{display:flex;align-items:center;gap:10px}
.line .n{flex:1;min-width:0}
.line .n div:last-child{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.total{display:flex;justify-content:space-between;border-top:1px dashed var(--line);margin-top:12px;padding-top:12px;font-weight:900;font-size:18px}
.total b{color:var(--pink);font-variant-numeric:tabular-nums}
form{display:flex;flex-direction:column;gap:12px}
label{display:flex;flex-direction:column;gap:4px;font-weight:700;font-size:14px}
input,select,textarea{font:inherit;color:var(--fg);background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
textarea{min-height:70px;resize:vertical}
.hint{font-size:13px;color:var(--muted);font-weight:400}
.pay{display:flex;gap:10px;align-items:flex-start;background:var(--green-soft);color:var(--green);border-radius:12px;padding:10px 12px;font-size:14px;font-weight:700}
.actions{display:flex;gap:10px;margin-top:6px}
.actions .btn{flex:1}

.done{text-align:center;padding:24px 0}
.done .big{font-size:56px}
.done h2{font-size:22px;color:var(--green)}
.oid{font-size:24px;font-weight:900;letter-spacing:1px;font-variant-numeric:tabular-nums}

.order{display:flex;flex-direction:column;gap:6px}
.order .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.order .meta{font-size:13px;color:var(--muted)}
.order pre{margin:0;font:inherit;white-space:pre-wrap;font-size:14px}
.pill{font-size:12px;font-weight:900;padding:3px 10px;border-radius:999px;background:var(--pink-soft);color:var(--pink);flex:none}
.pill.s-已確認{background:var(--green-soft);color:var(--green)}
.pill.s-可取貨{background:var(--gold);color:#3E2418}
.pill.s-已取貨{background:var(--line);color:var(--muted)}
.pill.s-已取消{background:var(--line);color:var(--muted);text-decoration:line-through}

.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:9;background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:700;max-width:calc(100% - 32px);text-align:center}
.loading{text-align:center;color:var(--muted);padding:60px 0}
@media (prefers-reduced-motion:no-preference){.item{transition:transform .15s}.item:active{transform:scale(.99)}}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="brand">
      <img src="logo.png" alt="蓁便誼">
      <div><h1>蓁便誼線上訂購</h1><p id="hello">朝陽代買王・幫你買・幫你找・幫你省</p></div>
    </div>
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" id="tab-shop" aria-selected="true">商品</button>
      <button class="tab" role="tab" id="tab-orders" aria-selected="false">我的訂單</button>
    </div>
  </div>
</header>

<main class="wrap">
  <div class="demo" id="demo" hidden>示範模式：商品是範例資料，送出不會真的下單。</div>
  <div class="loading" id="loading">載入中…</div>

  <section id="v-shop" hidden>
    <div class="chips" id="chips"></div>
    <div class="list" id="list"></div>
  </section>

  <section id="v-checkout" hidden>
    <h2>確認訂單</h2>
    <div class="card"><div class="lines" id="lines"></div><div class="total"><span>合計</span><b id="ck-total"></b></div></div>
    <h2>取貨資料</h2>
    <form id="ck-form" class="card" novalidate>
      <label>取貨人姓名<input id="f-name" autocomplete="name" maxlength="30" required></label>
      <label>手機號碼<input id="f-phone" inputmode="numeric" autocomplete="tel" maxlength="12" placeholder="09xxxxxxxx" required></label>
      <label>取貨日期<select id="f-date" required></select><span class="hint">營業時間 09:00–17:00，地點：板橋朝陽市場</span></label>
      <label>備註<textarea id="f-note" maxlength="200" placeholder="例如：香蕉要熟一點、下午才能取貨"></textarea></label>
      <div class="pay">💰 到店付款取貨，商品備妥後會用 LINE 通知您。</div>
      <p class="hint">您的姓名與電話僅用於本店訂單聯絡與取貨確認。</p>
      <div class="actions">
        <button type="button" class="btn ghost" id="ck-back">繼續逛</button>
        <button type="submit" class="btn" id="ck-submit">送出訂單</button>
      </div>
    </form>
  </section>

  <section id="v-done" hidden>
    <div class="done">
      <div class="big">🎉</div>
      <h2>訂單已送出！</h2>
      <p>訂單編號</p>
      <div class="oid" id="done-id"></div>
      <p id="done-msg"></p>
      <div class="actions"><button class="btn ghost" id="done-orders">看我的訂單</button><button class="btn" id="done-shop">繼續購物</button></div>
    </div>
  </section>

  <section id="v-orders" hidden>
    <h2>我的訂單</h2>
    <div class="list" id="orders"></div>
  </section>
</main>

<div class="bar" id="bar" hidden>
  <div class="wrap">
    <div class="sum"><b id="bar-total">$0</b><span id="bar-count">尚未選購</span></div>
    <button class="btn" id="bar-go" disabled>去結帳</button>
  </div>
</div>
<div class="toast" id="toast" role="status" hidden></div>

<script>
/* ===== 設定：上線前把這兩個值換成你自己的 ===== */
const CONFIG = {
  LIFF_ID: '2011973016-4pIKVjGr',
  API_URL: 'https://script.google.com/macros/s/AKfycbz77WagRZMUjP8RWKcQ6YD6vaYX9kJhDKJR6n3P3lydXXm99aw9LAV8-LwRKPCiGrfG/exec',
};
/* ============================================== */

const DEMO = !CONFIG.LIFF_ID || !CONFIG.API_URL;
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = (n) => '$' + Number(n).toLocaleString('zh-TW');

const state = { products: [], pickupDates: [], member: null, user: null, cart: {}, cat: '全部', view: 'shop' };

/* ---------- 範例資料（示範模式用） ---------- */
const localDate = (d = new Date()) => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
function demoDates(){ const out=[]; for(let i=0;i<7;i++) out.push(localDate(new Date(Date.now()+i*864e5))); return out; }
const DEMO_DATA = {
  user: { displayName: '王小美' },
  member: { name: '王小美', phone: '0912345678' },
  products: [
    { id:'P001', name:'舒潔衛生紙 100抽x12包', category:'生活用品', price:189, unit:'串', image:'', stock:30, desc:'量販價，每人限 3 串' },
    { id:'P002', name:'台灣香蕉', category:'生鮮食材', price:60, unit:'串', image:'', stock:null, desc:'朝陽市場當日進貨' },
    { id:'P003', name:'日本北海道牛奶糖', category:'進口商品', price:120, unit:'盒', image:'', stock:3, desc:'' },
    { id:'P004', name:'洗碗精補充包 1000ml', category:'居家好物', price:89, unit:'包', image:'', stock:20, desc:'' },
    { id:'P005', name:'有機小松菜', category:'生鮮食材', price:35, unit:'把', image:'', stock:null, desc:'早上 10 點前下單，當天可取' },
    { id:'P006', name:'韓國海苔 9入', category:'進口商品', price:99, unit:'組', image:'', stock:15, desc:'' },
  ],
  pickupDates: demoDates(),
};
const demoOrders = [
  { orderId:'261009-4821', time:'2026-10-09 10:12', summary:'台灣香蕉 x2\n洗碗精補充包 1000ml x1', total:209, pickupDate:'2026-10-09', status:'已取貨' },
];

/* ---------- 和後台溝通 ---------- */
async function api(action, extra = {}) {
  if (DEMO) {
    await new Promise(r => setTimeout(r, 300));
    if (action === 'init') return structuredClone(DEMO_DATA);
    if (action === 'myOrders') return { orders: demoOrders };
    if (action === 'order') {
      const id = localDate().slice(2).replace(/-/g,'') + '-' + (1000 + Math.floor(Math.random()*9000));
      const total = extra.order.items.reduce((s,i)=>s+i.qty*state.products.find(p=>p.id===i.id).price,0);
      demoOrders.unshift({ orderId:id, time:localDate()+' '+new Date().toTimeString().slice(0,5), summary:extra.order.items.map(i=>state.products.find(p=>p.id===i.id).name+' x'+i.qty).join('\n'), total, pickupDate:extra.order.pickupDate, status:'待確認' });
      return { orderId:id, total };
    }
  }
  const res = await fetch(CONFIG.API_URL, {
    method: 'POST',
    body: JSON.stringify({ action, idToken: liff.getIDToken(), ...extra }), // text/plain，避免跨網域預檢
  });
  const data = await res.json();
  if (!data.ok) throw new Error(data.error || '發生錯誤，請稍後再試');
  return data;
}

function loadScript(src){ return new Promise((ok,fail)=>{ const s=document.createElement('script'); s.src=src; s.onload=ok; s.onerror=()=>fail(new Error('無法載入 LINE 元件')); document.head.appendChild(s); }); }

async function boot() {
  try {
    if (!DEMO) {
      await loadScript('https://static.line-scdn.net/liff/edge/2/sdk.js');
      await liff.init({ liffId: CONFIG.LIFF_ID });
      if (!liff.isLoggedIn()) { liff.login({ redirectUri: location.href }); return; }
    } else {
      $('demo').hidden = false;
    }
    const d = await api('init');
    Object.assign(state, { products: d.products, pickupDates: d.pickupDates, member: d.member, user: d.user });
    try { state.cart = JSON.parse(localStorage.getItem('zby-cart') || '{}'); } catch { state.cart = {}; }
    for (const id in state.cart) if (!state.products.some(p => p.id === id)) delete state.cart[id];
    if (d.user?.displayName) $('hello').textContent = `嗨，${d.user.displayName}！今天想買什麼？`;
    $('loading').hidden = true;
    show('shop');
  } catch (e) {
    $('loading').textContent = e.message;
  }
}

/* ---------- 畫面 ---------- */
function show(view) {
  state.view = view;
  for (const v of ['shop','checkout','done','orders']) $('v-'+v).hidden = v !== view;
  $('tab-shop').setAttribute('aria-selected', String(view !== 'orders'));
  $('tab-orders').setAttribute('aria-selected', String(view === 'orders'));
  $('bar').hidden = view !== 'shop';
  if (view === 'shop') renderShop();
  if (view === 'checkout') renderCheckout();
  if (view === 'orders') renderOrders();
  window.scrollTo(0, 0);
}

function saveCart(){ try { localStorage.setItem('zby-cart', JSON.stringify(state.cart)); } catch {} }
function cartLines(){ return Object.entries(state.cart).map(([id,qty])=>({ p: state.products.find(x=>x.id===id), qty })).filter(l=>l.p && l.qty>0); }
function cartTotal(){ return cartLines().reduce((s,l)=>s+l.p.price*l.qty,0); }
function maxQty(p){ return p.stock == null ? 99 : Math.min(99, p.stock); }

function setQty(id, qty) {
  const p = state.products.find(x => x.id === id);
  qty = Math.max(0, Math.min(maxQty(p), qty));
  if (qty) state.cart[id] = qty; else delete state.cart[id];
  saveCart();
  if (state.view === 'shop') renderShop(); else renderCheckout();
}

function stepper(p) {
  const q = state.cart[p.id] || 0;
  return `<div class="step">
    ${q ? `<button data-dec="${esc(p.id)}" aria-label="減少">−</button><output>${q}</output>` : ''}
    <button class="add" data-inc="${esc(p.id)}" aria-label="加入 ${esc(p.name)}" ${q >= maxQty(p) ? 'disabled' : ''}>＋</button>
  </div>`;
}

function renderShop() {
  const cats = ['全部', ...new Set(state.products.map(p => p.category))];
  $('chips').innerHTML = cats.map(c => `<button class="chip" data-cat="${esc(c)}" aria-pressed="${c === state.cat}">${esc(c)}</button>`).join('');
  const items = state.products.filter(p => state.cat === '全部' || p.category === state.cat);
  $('list').innerHTML = items.length ? items.map(p => {
    const out = p.stock != null && p.stock <= 0;
    const thumb = p.image ? `<img class="thumb" src="${esc(p.image)}" alt="" loading="lazy">` : `<div class="thumb" aria-hidden="true">${esc(p.name[0])}</div>`;
    const stock = p.stock == null ? '' : out ? '<span class="stock low">已售完</span>' : p.stock <= 5 ? `<span class="stock low">剩 ${p.stock} ${esc(p.unit)}</span>` : `<span class="stock">庫存 ${p.stock}</span>`;
    return `<article class="item">${thumb}<div class="info">
      <div class="name">${esc(p.name)}</div>
      ${p.desc ? `<div class="desc">${esc(p.desc)}</div>` : ''}
      ${stock}
      <div class="row"><div class="price">${money(p.price)}<small> / ${esc(p.unit || '件')}</small></div>${out ? '' : stepper(p)}</div>
    </div></article>`;
  }).join('') : '<div class="empty">這個分類目前沒有商品</div>';
  const n = cartLines().reduce((s,l)=>s+l.qty,0);
  $('bar-total').textContent = money(cartTotal());
  $('bar-count').textContent = n ? `已選 ${n} 件・到店付款取貨` : '尚未選購';
  $('bar-go').disabled = !n;
}

function renderCheckout() {
  const lines = cartLines();
  if (!lines.length) { show('shop'); return; }
  $('lines').innerHTML = lines.map(({p,qty}) => `<div class="line">
    <div class="n"><div>${esc(p.name)}</div><div>${money(p.price)} × ${qty} = ${money(p.price*qty)}</div></div>${stepper(p)}</div>`).join('');
  $('ck-total').textContent = money(cartTotal());
  if (!$('f-date').options.length) {
    const wk = '日一二三四五六';
    $('f-date').innerHTML = state.pickupDates.map((d,i) => {
      const dt = new Date(d + 'T00:00:00'); const label = `${dt.getMonth()+1}/${dt.getDate()}（${wk[dt.getDay()]}）${d===localDate() ? '今天' : ''}`;
      return `<option value="${d}">${label}</option>`; }).join('');
    if (state.member) { $('f-name').value = state.member.name; $('f-phone').value = state.member.phone; }
    else if (state.user) $('f-name').value = state.user.displayName;
  }
}

async function renderOrders() {
  $('orders').innerHTML = '<div class="loading">載入中…</div>';
  try {
    const { orders } = await api('myOrders');
    $('orders').innerHTML = orders.length ? orders.map(o => `<article class="card order">
      <div class="top"><b>${esc(o.orderId)}</b><span class="pill s-${esc(o.status)}">${esc(o.status)}</span></div>
      <div class="meta">下單 ${esc(o.time)}・取貨 ${esc(o.pickupDate)}</div>
      <pre>${esc(o.summary)}</pre>
      <div class="total" style="margin-top:4px;padding-top:8px;font-size:16px"><span>合計</span><b>${money(o.total)}</b></div>
    </article>`).join('') : '<div class="empty">還沒有訂單，去逛逛吧！</div>';
  } catch (e) { $('orders').innerHTML = `<div class="empty">${esc(e.message)}</div>`; }
}

let toastTimer;
function toast(msg){ $('toast').textContent = msg; $('toast').hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(()=>$('toast').hidden = true, 2600); }

/* ---------- 事件 ---------- */
document.addEventListener('click', (e) => {
  const t = e.target.closest('button'); if (!t) return;
  if (t.dataset.inc) setQty(t.dataset.inc, (state.cart[t.dataset.inc] || 0) + 1);
  else if (t.dataset.dec) setQty(t.dataset.dec, (state.cart[t.dataset.dec] || 0) - 1);
  else if (t.dataset.cat) { state.cat = t.dataset.cat; renderShop(); }
});
$('tab-shop').onclick = () => show('shop');
$('tab-orders').onclick = () => show('orders');
$('bar-go').onclick = () => show('checkout');
$('ck-back').onclick = () => show('shop');
$('done-shop').onclick = () => show('shop');
$('done-orders').onclick = () => show('orders');

$('ck-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const name = $('f-name').value.trim();
  const phone = $('f-phone').value.replace(/\D/g, '');
  if (!name) return toast('請填寫取貨人姓名');
  if (!/^09\d{8}$/.test(phone)) return toast('手機號碼請填 09 開頭的 10 碼');
  const btn = $('ck-submit'); btn.disabled = true; btn.textContent = '送出中…';
  try {
    const order = { items: cartLines().map(l => ({ id: l.p.id, qty: l.qty })), name, phone, pickupDate: $('f-date').value, note: $('f-note').value.trim() };
    const r = await api('order', { order });
    state.member = { name, phone };
    state.cart = {}; saveCart(); $('f-note').value = '';
    $('done-id').textContent = r.orderId;
    $('done-msg').textContent = `合計 ${money(r.total)}，請於 ${order.pickupDate} 到店付款取貨。`;
    show('done');
    if (!DEMO) { try { const fresh = await api('init'); state.products = fresh.products; } catch {} }
  } catch (err) {
    toast(err.message);
  } finally { btn.disabled = false; btn.textContent = '送出訂單'; }
});

boot();
</script>
</body>
</html>
